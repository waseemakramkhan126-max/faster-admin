<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster Admin - Pending Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #334155; margin: 0; }
        
        .premium-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .premium-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08); }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-6">

    <header class="max-w-6xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center border-b border-slate-200 pb-5 mb-6 gap-4">
        <div class="flex items-center gap-4 w-full sm:w-auto">
            <button onclick="location.href='order-management.html'" class="w-10 h-10 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 flex items-center justify-center transition-all shadow-sm active:scale-95">
                <i class="fas fa-chevron-left text-sm"></i>
            </button>
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center text-orange-600">
                    <i class="fas fa-clock text-lg animate-pulse"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-slate-800 tracking-tight uppercase">Incoming Pending Gateway</h1>
                    <p class="text-xs text-slate-500 font-medium">Live control matrix for newly received order queues</p>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 shadow-sm self-end sm:self-auto">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            <span>Live Sync Active</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full flex-1">
        <div id="mainLoader" class="flex flex-col items-center justify-center py-24 opacity-60">
            <i class="fas fa-circle-notch animate-spin text-3xl text-orange-500 mb-3"></i>
            <p class="text-xs font-bold uppercase tracking-widest text-slate-600">Syncing Pending Matrix...</p>
        </div>

        <div id="ordersList" class="hidden flex flex-col gap-3 w-full">
            </div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center premium-card rounded-3xl p-8">
            <div class="w-16 h-16 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-400 mb-4 text-xl">
                <i class="fas fa-box-open"></i>
            </div>
            <h3 class="text-slate-800 font-bold text-sm uppercase tracking-wider">No Pending Orders</h3>
            <p class="text-xs text-slate-500 max-w-xs mt-1">Sabhi orders processed ho chuke hain. Naye orders ka intezar karein.</p>
        </div>
    </main>

    <div id="riderModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-md z-[9999] flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white border border-slate-200 rounded-[2rem] p-6 shadow-2xl flex flex-col max-h-[85vh]">
            
            <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                <div>
                    <h3 class="text-slate-800 font-black text-sm uppercase tracking-wider">Select Available Rider</h3>
                    <p class="text-[10px] text-slate-500 font-bold mt-0.5">Order dispatch karne k liye rider assign karein</p>
                </div>
                <button onclick="closeRiderModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition-all">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>

            <div class="relative mb-4">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400 text-xs">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" id="riderSearch" oninput="filterRidersList()" placeholder="Search by Rider ID, Name or Phone..." class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-slate-400 text-slate-700 placeholder-slate-400 transition-all">
            </div>
            
            <div id="ridersContainer" class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-1 min-h-[250px]">
                </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let activeTargetOrderId = null;
        let globalRidersArray = []; // Local cache for real-time search filtering

        // --- FETCH & LOAD PENDING ORDERS ---
        async function loadPendingOrders() {
            try {
                const { data: orders, error } = await _supabase
                    .from('orders')
                    .select('*')
                    .eq('status', 'pending')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                document.getElementById('mainLoader').classList.add('hidden');
                const container = document.getElementById('ordersList');
                const emptyState = document.getElementById('emptyState');

                if (!orders || orders.length === 0) {
                    container.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                container.classList.remove('hidden');

                container.innerHTML = orders.map(order => {
                    const timeStr = new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const dateStr = new Date(order.created_at).toLocaleDateString();
                    const shortDetails = order.order_details ? order.order_details.replace(/\n/g, ', ') : 'No items description.';

                    return `
                        <div class="premium-card rounded-2xl p-3 sm:px-5 sm:py-3.5 flex flex-col lg:flex-row lg:items-center justify-between gap-4 relative group w-full">
                            
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 text-[10px] font-bold uppercase text-slate-400 mb-1">
                                    <span class="text-slate-800 font-black">ID: #${order.id.toString().slice(-6).toUpperCase()}</span>
                                    <span>•</span>
                                    <span><i class="fas fa-clock text-blue-500 mr-1"></i>${timeStr}</span>
                                    <span class="hidden sm:inline">•</span>
                                    <span class="hidden sm:inline text-[9px]">${dateStr}</span>
                                    <span class="ml-1 bg-orange-500/10 text-orange-600 px-1.5 py-0.5 rounded text-[8px] font-black uppercase tracking-widest border border-orange-500/10">Pending</span>
                                </div>
                                <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3">
                                    <h4 class="text-slate-800 font-black text-sm truncate max-w-[180px]">${order.customer_name || 'Customer'}</h4>
                                    <span class="hidden sm:inline text-slate-300">|</span>
                                    <p class="text-[11px] font-semibold text-slate-500 truncate"><i class="fas fa-map-marker-alt text-[9px] mr-1 text-orange-500"></i>${order.delivery_address || 'No Address'}</p>
                                </div>
                            </div>

                            <div class="flex-1 min-w-0 bg-slate-50 border border-slate-100 rounded-xl px-3 py-1.5 lg:max-w-md">
                                <p class="font-black text-[8px] text-slate-400 uppercase tracking-widest mb-0.5">Order Items</p>
                                <p class="text-slate-700 text-xs font-semibold truncate">${shortDetails}</p>
                            </div>

                            <div class="flex items-center justify-between lg:justify-end gap-5 border-t border-slate-100 pt-2.5 lg:pt-0 lg:border-t-0 shrink-0">
                                <div class="lg:text-right">
                                    <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Est. Bill</p>
                                    <p class="text-base font-black text-slate-800">Rs. ${order.bill_amount || 0}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="triggerCancelOrder(${order.id})" class="px-3 py-2 bg-red-50 hover:bg-red-500 border border-red-200 text-red-600 hover:text-white font-black text-[9px] uppercase tracking-widest rounded-lg transition-all flex items-center gap-1">
                                        <i class="fas fa-ban text-[8px]"></i> Cancel
                                    </button>
                                    <button onclick="openRiderModal(${order.id})" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-black text-[9px] uppercase tracking-widest rounded-lg shadow-sm active:scale-95 transition-all flex items-center gap-1">
                                        <i class="fas fa-paper-plane text-[8px]"></i> Assign
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('ordersList').innerHTML = `<div class="col-span-full py-12 text-center text-red-500 font-bold text-xs uppercase tracking-wider">Failed to sync pending data matrix.</div>`;
            }
        }

        // --- CANCEL ORDER WITH REASON ---
        async function triggerCancelOrder(id) {
            const reason = prompt("Order cancel karne ki wajah (Reason) likhen:");
            if (reason === null) return; 
            if (reason.trim() === "") {
                alert("❌ Reason likhna zaroori hai order cancel karne ke liye!");
                return;
            }

            try {
                const { error } = await _supabase
                    .from('orders')
                    .update({ 
                        status: 'canceled', 
                        rider_status: 'Canceled by Admin',
                        cancel_reason: reason.trim(),
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', id);

                if (error) throw error;
                alert("✅ Order kamyabi se cancel kar diya gaya hai.");
                loadPendingOrders();

            } catch (err) {
                alert("❌ Operation Fail: " + err.message);
            }
        }

        // --- RIDER ASSIGNMENT MODAL OPERATIONS ---
        async function openRiderModal(orderId) {
            activeTargetOrderId = orderId;
            const modal = document.getElementById('riderModal');
            const listContainer = document.getElementById('ridersContainer');
            document.getElementById('riderSearch').value = ''; 
            
            modal.classList.remove('hidden');
            listContainer.innerHTML = `<div class="text-center py-10 opacity-60"><i class="fas fa-circle-notch animate-spin text-lg mb-1 text-slate-600"></i><p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Loading Riders...</p></div>`;

            try {
                const { data: riders, error } = await _supabase.from('riders').select('*').order('id', { ascending: true });
                if (error) throw error;

                globalRidersArray = riders || []; 
                renderRiders(globalRidersArray);

            } catch (err) {
                listContainer.innerHTML = `<div class="text-center py-10 text-xs text-red-500 font-bold uppercase">Riders data fetch fail.</div>`;
            }
        }

        // ⚡ UPDATED: Displays Rider ID cleanly inside list row
        function renderRiders(ridersList) {
            const listContainer = document.getElementById('ridersContainer');
            if (ridersList.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-10 text-xs font-bold text-slate-400 uppercase">No riders match search query.</div>`;
                return;
            }

            listContainer.innerHTML = ridersList.map(rider => `
                <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl flex items-center justify-between gap-4 hover:border-slate-200 transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg bg-slate-200 flex items-center justify-center font-bold text-slate-700 text-xs uppercase">
                            ${rider.id}
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="text-slate-800 font-bold text-xs tracking-tight">${rider.name || 'Unnamed Rider'}</h4>
                                <span class="bg-blue-50 text-blue-600 text-[9px] font-extrabold px-1.5 py-0.5 rounded border border-blue-100">ID: ${rider.id}</span>
                            </div>
                            <p class="text-[10px] text-slate-500 font-bold mt-0.5"><i class="fas fa-phone mr-1 text-[8px] text-slate-400"></i>${rider.phone}</p>
                        </div>
                    </div>
                    <button onclick="executeRiderAssignment(${rider.id}, '${rider.phone}')" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-[9px] uppercase tracking-widest rounded-lg transition-all active:scale-95">
                        Select
                    </button>
                </div>
            `).join('');
        }

        // --- ⚡ UPDATED: LIVE SEARCH FILTER ENGINE FOR RIDERS (Filters by ID, Name, Phone) ---
        function filterRidersList() {
            const query = document.getElementById('riderSearch').value.toLowerCase().trim();
            if (!query) {
                renderRiders(globalRidersArray);
                return;
            }

            const filtered = globalRidersArray.filter(rider => {
                const idMatch = rider.id ? rider.id.toString().toLowerCase().includes(query) : false;
                const nameMatch = rider.name ? rider.name.toLowerCase().includes(query) : false;
                const phoneMatch = rider.phone ? rider.phone.includes(query) : false;
                return idMatch || nameMatch || phoneMatch;
            });

            renderRiders(filtered);
        }

        function closeRiderModal() {
            document.getElementById('riderModal').classList.add('hidden');
            activeTargetOrderId = null;
        }

        // --- ⚡ UPDATED: EXECUTE RIDER ROUTING PIPELINE (Fixes rider_id & assigned_at) ---
        async function executeRiderAssignment(riderId, riderPhone) {
            if (!activeTargetOrderId) return;
            
            try {
                // Now perfectly updates rider_id and assigned_at timestamps
                const { error } = await _supabase
                    .from('orders')
                    .update({
                        rider_id: riderId, 
                        rider_phone: riderPhone,
                        status: 'pending', // Retaining pending state so it stays in active loop pools
                        rider_status: 'Assigned',
                        assigned_at: new Date().toISOString(), 
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', activeTargetOrderId);

                if (error) throw error;

                alert("🚀 Order rider ko kamyabi se assign kar diya gaya hai!");
                closeRiderModal();
                loadPendingOrders();

            } catch (err) {
                alert("❌ Assignment Failed: " + err.message);
            }
        }

        // --- REALTIME DATABASE SYNC CHANNEL ---
        function initiateRealtimeTracker() {
            _supabase.channel('live-pending-tracker')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
                    loadPendingOrders();
                }).subscribe();
        }

        window.onload = () => {
            loadPendingOrders();
            initiateRealtimeTracker();
        };
    </script>
</body>
</html>
