<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Pending Orders Terminal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #94a3b8; margin: 0; }
.glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
.custom-scroll::-webkit-scrollbar { width: 6px; }
.custom-scroll::-webkit-scrollbar-track { background: transparent; }
.custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
</style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-6">

    <header class="max-w-6xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center border-b border-slate-800 pb-5 mb-6 gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center text-orange-500">
                <i class="fas fa-clock text-lg animate-pulse"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-white tracking-tight uppercase">Pending Orders</h1>
                <p class="text-xs text-slate-400 font-medium">Manage and assign newly arrived orders</p>
            </div>
        </div>
        <div class="flex items-center gap-3 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800 text-xs font-bold text-slate-300">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            <span>Live Sync Active</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full flex-1">
        <div id="mainLoader" class="flex flex-col items-center justify-center py-24 opacity-40">
            <i class="fas fa-circle-notch animate-spin text-3xl text-orange-500 mb-3"></i>
            <p class="text-xs font-bold uppercase tracking-widest text-slate-300">Fetching Pending Orders...</p>
        </div>

        <div id="ordersList" class="hidden grid grid-cols-1 md:grid-cols-2 gap-5">
            </div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center glass-card rounded-3xl p-8">
            <div class="w-16 h-16 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-500 mb-4 text-xl">
                <i class="fas fa-box-open"></i>
            </div>
            <h3 class="text-white font-bold text-sm uppercase tracking-wider">No Pending Orders</h3>
            <p class="text-xs text-slate-400 max-w-xs mt-1">Sabhi orders processed ho chuke hain. Naye orders ka intezar karein.</p>
        </div>
    </main>

    <div id="riderModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md z-[9999] flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-[2rem] p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                <div>
                    <h3 class="text-white font-black text-sm uppercase tracking-wider">Select Available Rider</h3>
                    <p class="text-[10px] text-slate-400 font-bold mt-0.5">Order ko forward karne ke liye rider chunen</p>
                </div>
                <button onclick="closeRiderModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center transition-all">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>
            
            <div id="ridersContainer" class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-1 min-h-[250px]">
                </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let activeTargetOrderId = null;

        // --- FETCH & LOAD PENDING ORDERS ---
        async function loadPendingOrders() {
            try {
                const { data: orders, error } = await _supabase
                    .from('orders')
                    .select('*')
                    .eq('status', 'pending')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                document.getElementById('mainLoader').classList.add('hidden');
                const container = document.getElementById('ordersList');
                const emptyState = document.getElementById('emptyState');

                if (!orders || orders.length === 0) {
                    container.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                container.classList.remove('hidden');

                container.innerHTML = orders.map(order => {
                    const timeStr = new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const dateStr = new Date(order.created_at).toLocaleDateString();
                    
                    return `
                        <div class="glass-card rounded-[2rem] p-5 flex flex-col justify-between hover:border-slate-700 transition-all relative overflow-hidden group">
                            <div class="absolute top-0 right-0 bg-orange-500/10 text-orange-400 px-4 py-1.5 rounded-bl-2xl text-[9px] font-black uppercase tracking-widest border-l border-b border-orange-500/10">
                                Pending
                            </div>

                            <div>
                                <div class="flex items-center gap-2 text-[10px] font-bold uppercase text-slate-400 mb-3">
                                    <span class="text-white font-black">ID: #${order.id.toString().slice(-6).toUpperCase()}</span>
                                    <span>•</span>
                                    <span><i class="fas fa-clock text-blue-400 mr-1"></i>${timeStr}</span>
                                    <span>•</span>
                                    <span>${dateStr}</span>
                                </div>

                                <div class="mb-4">
                                    <h4 class="text-white font-black text-sm tracking-tight">${order.customer_name || 'Walking Customer'}</h4>
                                    <p class="text-[11px] font-bold text-slate-400 mt-0.5"><i class="fas fa-phone-alt text-[9px] mr-1 text-slate-500"></i>${order.customer_phone}</p>
                                    <p class="text-[11px] font-medium text-orange-400/90 mt-1 line-clamp-2 uppercase tracking-tight"><i class="fas fa-map-marker-alt text-[9px] mr-1 text-orange-500"></i>${order.delivery_address || 'No Address Provided'}</p>
                                </div>

                                <div class="bg-slate-950/40 border border-slate-800/60 rounded-2xl p-3 mb-4 text-xs">
                                    <p class="font-black text-[9px] text-slate-500 uppercase tracking-widest mb-1.5">Order Details</p>
                                    <div class="text-slate-300 font-semibold leading-relaxed whitespace-pre-line">${order.order_details || 'No items description found.'}</div>
                                </div>
                            </div>

                            <div class="pt-3 border-t border-slate-800/60 flex items-center justify-between gap-4">
                                <div>
                                    <p class="text-[8px] font-black text-slate-500 uppercase tracking-widest">Estimated Bill</p>
                                    <p class="text-lg font-black text-white">Rs. ${order.bill_amount || 0}</p>
                                </div>
                                <div class="flex gap-2 flex-1 justify-end">
                                    <button onclick="triggerCancelOrder(${order.id})" class="px-4 py-3 bg-red-500/10 hover:bg-red-500 border border-red-500/20 hover:border-red-600 text-red-400 hover:text-white font-black text-[10px] uppercase tracking-widest rounded-xl transition-all flex items-center gap-1.5">
                                        <i class="fas fa-ban"></i> Cancel
                                    </button>
                                    <button onclick="openRiderModal(${order.id})" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white font-black text-[10px] uppercase tracking-widest rounded-xl shadow-lg hover:shadow-blue-600/20 active:scale-95 transition-all flex items-center gap-1.5">
                                        <i class="fas fa-paper-plane"></i> Assign Rider
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('ordersList').innerHTML = `<div class="col-span-full py-12 text-center text-red-400 font-bold text-xs uppercase tracking-wider">Failed to sync pending data matrix.</div>`;
            }
        }

        // --- CANCEL ORDER FUNCTIONALITY WITH REASON ---
        async function triggerCancelOrder(id) {
            const reason = prompt("Order cancel karne ki wajah (Reason) likhen:");
            if (reason === null) return; // Cancel trigger sequence aborted
            if (reason.trim() === "") {
                alert("❌ Reason likhna zaroori hai order cancel karne ke liye!");
                return;
            }

            try {
                const { error } = await _supabase
                    .from('orders')
                    .update({ 
                        status: 'canceled', 
                        rider_status: 'Canceled by Admin',
                        cancel_reason: reason.trim(),
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', id);

                if (error) throw error;
                alert("✅ Order kamyabi se cancel kar diya gaya hai.");
                loadPendingOrders();

            } catch (err) {
                alert("❌ Operation Fail: " + err.message);
            }
        }

        // --- RIDER ASSIGNMENT MODAL OPERATIONS ---
        async function openRiderModal(orderId) {
            activeTargetOrderId = orderId;
            const modal = document.getElementById('riderModal');
            const listContainer = document.getElementById('ridersContainer');
            
            modal.classList.remove('hidden');
            listContainer.innerHTML = `<div class="text-center py-10 opacity-40"><i class="fas fa-circle-notch animate-spin text-lg mb-1"></i><p class="text-[10px] font-bold uppercase tracking-wider">Loading Riders...</p></div>`;

            try {
                // Fetching riders list
                const { data: riders, error } = await _supabase.from('riders').select('*');
                if (error) throw error;

                if (!riders || riders.length === 0) {
                    listContainer.innerHTML = `<div class="text-center py-10 text-xs font-bold text-slate-500 uppercase">No riders registered in DB.</div>`;
                    return;
                }

                listContainer.innerHTML = riders.map(rider => `
                    <div class="p-3 bg-slate-950/50 border border-slate-800 rounded-xl flex items-center justify-between gap-4 hover:border-slate-700 transition-all">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-white text-xs uppercase">
                                ${rider.name ? rider.name.slice(0,2) : 'R'}
                            </div>
                            <div>
                                <h4 class="text-white font-bold text-xs tracking-tight">${rider.name || 'Unnamed Rider'}</h4>
                                <p class="text-[10px] text-slate-500 font-bold">${rider.phone}</p>
                            </div>
                        </div>
                        <button onclick="executeRiderAssignment('${rider.phone}')" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-[9px] uppercase tracking-widest rounded-lg transition-all active:scale-95">
                            Select
                        </button>
                    </div>
                `).join('');

            } catch (err) {
                listContainer.innerHTML = `<div class="text-center py-10 text-xs text-red-400 font-bold uppercase">Riders data fetch fail.</div>`;
            }
        }

        function closeRiderModal() {
            document.getElementById('riderModal').classList.add('hidden');
            activeTargetOrderId = null;
        }

        async function executeRiderAssignment(riderPhone) {
            if (!activeTargetOrderId) return;
            
            try {
                const { error } = await _supabase
                    .from('orders')
                    .update({
                        rider_phone: riderPhone,
                        status: 'assigned', // Status changed from pending to assigned
                        rider_status: 'Assigned',
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', activeTargetOrderId);

                if (error) throw error;

                alert("🚀 Order rider ko kamyabi se assign kar diya gaya hai!");
                closeRiderModal();
                loadPendingOrders();

            } catch (err) {
                alert("❌ Assignment Failed: " + err.message);
            }
        }

        // --- REALTIME SYNC ENGINE ---
        function initiateRealtimeTracker() {
            _supabase.channel('live-pending-tracker')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
                    console.log("Realtime Alert: Table synchronized.");
                    loadPendingOrders();
                }).subscribe();
        }

        // --- INITIALIZATION ---
        window.onload = () => {
            loadPendingOrders();
            initiateRealtimeTracker();
        };
    </script>
</body>
</html>
