<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster Admin - Secure Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-slate-800 h-screen flex items-center justify-center p-6 font-sans">

    <div class="w-full max-w-sm bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-slate-100 rounded-lg mx-auto flex items-center justify-center mb-4">
                <i class="fas fa-user-shield text-slate-700 text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight uppercase italic">Admin Access</h1>
            <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mt-1">Authorized Personnel Only</p>
        </div>

        <form id="adminLoginForm" class="space-y-4">
            <div class="relative">
                <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="email" id="adminEmail" placeholder="Enter Admin Email" required
                       class="w-full pl-10 pr-3 py-2.5 bg-white border border-gray-300 rounded-md outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500 text-sm text-slate-800 transition-colors font-bold text-left">
            </div>

            <div class="relative">
                <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="password" id="adminPassword" placeholder="Enter Password" required
                       class="w-full pl-10 pr-3 py-2.5 bg-white border border-gray-300 rounded-md outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500 text-sm text-slate-800 transition-colors font-bold text-left">
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-slate-900 hover:bg-black text-white font-black py-2.5 rounded-md text-sm tracking-wide transition-colors focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-1 mt-2">
                SECURE LOGIN
            </button>
        </form>
    </div>

    <script>
        // ==========================================
        // 1. Supabase Configuration & Initialization
        // ==========================================
        const supabaseUrl = 'https://hkabhikizdlbavfkualt.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U';

        let supabaseClient = null;

        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
            } else {
                console.error("Supabase CDN library load nahi hui!");
                alert("System Error: Supabase library missing.");
            }
        } catch (initError) {
            console.error("Supabase initialization crash:", initError);
        }

        // ==========================================
        // 2. Custom RPC Authentication (Highly Secure)
        // ==========================================
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!supabaseClient) {
                alert("System Error: Supabase connected nahi hai.");
                return;
            }

            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.innerText = "VERIFYING...";
            btn.disabled = true;

            try {
                // Secure RPC login execute ho raha hai
                const { data, error } = await supabaseClient
                    .rpc('secure_admin_login', {
                        p_gmail: email,
                        p_password: password
                    });

                if (error || !data || data.length === 0) {
                    throw new Error("Invalid Email or Password");
                }

                const adminUser = data[0]; 

                localStorage.setItem('isAdminLoggedIn', 'true');
                localStorage.setItem('adminSessionStart', Date.now());
                localStorage.setItem('adminName', adminUser.name); 
                
                btn.innerText = "ACCESS GRANTED...";
                // Flat Emerald UI for success state
                btn.className = "w-full bg-emerald-600 text-white font-black py-2.5 rounded-md text-sm tracking-wide transition-colors mt-2";
                
                setTimeout(() => {
                    location.href = 'dashboard.html';
                }, 1000);

            } catch (err) {
                alert(`Authentication Failed: ${err.message} ❌`);
                // Errore aane par text aur smooth flat look wapas secure login par reset hoga
                btn.innerText = "SECURE LOGIN";
                btn.className = "w-full bg-slate-900 hover:bg-black text-white font-black py-2.5 rounded-md text-sm tracking-wide transition-colors focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-1 mt-2";
                btn.disabled = false;
                document.getElementById('adminPassword').value = '';
            }
        });
    </script>
</body>
</html>
