<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster Admin - Secure Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-white rounded-[2.5rem] p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-orange-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4">
                <i class="fas fa-user-shield text-white text-4xl"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 italic uppercase">Admin Access</h1>
            <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mt-1">Authorized Personnel Only</p>
        </div>

        <form id="adminLoginForm" class="space-y-4">
            <div class="relative">
                <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="email" id="adminEmail" placeholder="Enter Admin Email" required
                       class="w-full pl-12 pr-4 py-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 ring-orange-500 font-bold text-left">
            </div>

            <div class="relative">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="password" id="adminPassword" placeholder="Enter Password" required
                       class="w-full pl-12 pr-4 py-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 ring-orange-500 font-bold text-left">
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all">
                SECURE LOGIN
            </button>
        </form>
    </div>

    <script>
        // ==========================================
        // 1. Supabase Configuration & Initialization
        // ==========================================
        const supabaseUrl = 'https://hkabhikizdlbavfkualt.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U';

        let supabaseClient = null;

        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
            } else {
                console.error("Supabase CDN library load nahi hui!");
                alert("System Error: Supabase library missing.");
            }
        } catch (initError) {
            console.error("Supabase initialization crash:", initError);
        }

        // ==========================================
        // 2. Form Submit Handling & Authentication
        // ==========================================
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!supabaseClient) {
                alert("System Error: Supabase connected nahi hai.");
                return;
            }

            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');

            // Button State Changing
            btn.innerText = "VERIFYING...";
            btn.disabled = true;

            try {
                // Supabase Auth call for actual authentication
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    throw error;
                }

                // Agar login successful ho jaye
                if (data.user) {
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    localStorage.setItem('adminSessionStart', Date.now());
                    
                    btn.innerText = "ACCESS GRANTED...";
                    btn.className = "w-full bg-green-500 text-white font-black py-4 rounded-2xl shadow-xl";
                    
                    setTimeout(() => {
                        // Aapko dashboard par redirect kar dega
                        location.href = 'dashboard.html';
                    }, 1000);
                }

            } catch (err) {
                alert(`Authentication Failed: ${err.message} ❌`);
                // Reset Button
                btn.innerText = "SECURE LOGIN";
                btn.disabled = false;
                document.getElementById('adminPassword').value = '';
            }
        });
    </script>
</body>
</html>
