<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FasterHub — Announcements</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f6f7fb; --bg2: #eef0f7; --surface: #ffffff; --surface2: #f8f9fd;
            --surface3: #f0f2f9; --border: rgba(15,22,35,0.06); --border2: rgba(15,22,35,0.10);
            --text: #0b1018; --text2: #2a3045; --muted: #7b8298; --muted2: #5a6178;
            --accent: #f05a14; --accent-dim: rgba(240,90,20,0.07); --accent-border: rgba(240,90,20,0.18);
            --accent-hover: #d94a0a; --green: #0f9d4a; --green-dim: rgba(15,157,74,0.07);
            --blue: #1a56db; --blue-dim: rgba(26,86,219,0.07); --red: #d92c2c;
            --red-dim: rgba(217,44,44,0.07); --amber: #c27803; --amber-dim: rgba(194,120,3,0.07);
            --purple: #6c2bd9; --purple-dim: rgba(108,43,217,0.07); --sky: #0374a8;
            --sky-dim: rgba(3,116,168,0.07); --shadow-sm: 0 1px 2px rgba(11,16,24,0.04);
            --shadow-md: 0 4px 16px rgba(11,16,24,0.06); --shadow-lg: 0 8px 32px rgba(11,16,24,0.09);
            --shadow-xl: 0 16px 48px rgba(11,16,24,0.12); --radius-sm: 8px; --radius: 12px;
            --radius-lg: 16px; --radius-xl: 20px; --transition-fast: 0.15s cubic-bezier(0.4,0,0.2,1);
            --transition: 0.22s cubic-bezier(0.4,0,0.2,1); --transition-slow: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter','Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;-webkit-font-smoothing:antialiased}
        .sidebar{width:68px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;z-index:50;flex-shrink:0;transition:width var(--transition-slow);overflow:hidden;box-shadow:var(--shadow-md)}
        @media(min-width:768px){.sidebar:hover{width:228px}.sidebar:hover .nav-text{opacity:1;transform:translateX(0);pointer-events:auto}.sidebar:hover .logo-text{opacity:1;max-width:120px}}
        @media(max-width:767px){.sidebar{position:fixed;top:0;left:0;transform:translateX(-100%);transition:transform var(--transition-slow);width:228px;border-radius:0 var(--radius-xl) var(--radius-xl) 0;box-shadow:var(--shadow-xl)}.sidebar.open{transform:translateX(0)}.nav-text{opacity:1;transform:translateX(0);pointer-events:auto}.logo-text{opacity:1;max-width:120px}}
        .logo-text{opacity:0;max-width:0;transition:opacity var(--transition),max-width var(--transition-slow);white-space:nowrap;font-family:'Playfair Display',serif;font-weight:800;font-size:15px;color:var(--text);overflow:hidden}
        .nav-text{opacity:0;transform:translateX(-8px);pointer-events:none;transition:opacity var(--transition),transform var(--transition);white-space:nowrap;font-family:'Inter','Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600}
        .nav-link{display:flex;align-items:center;gap:13px;padding:10px 18px;border-radius:var(--radius);color:var(--muted);text-decoration:none;transition:all var(--transition-fast);position:relative;margin:1.5px 0;font-weight:500}
        .nav-link:hover{color:var(--text2);background:var(--surface2)}.nav-link.active{color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-border);font-weight:700;box-shadow:0 2px 8px rgba(240,90,20,0.08)}
        .nav-link.active::before{content:'';position:absolute;left:0;top:18%;bottom:18%;width:3px;background:var(--accent);border-radius:999px}
        .nav-icon{width:30px;text-align:center;font-size:13px;flex-shrink:0}
        .overlay{display:none;position:fixed;inset:0;background:rgba(11,16,24,0.35);z-index:40;backdrop-filter:blur(6px)}.overlay.show{display:block}
        .main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;z-index:1;min-width:0}
        .header{height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:12px;flex-shrink:0;z-index:200;box-shadow:var(--shadow-sm)}
        .nav-btn{display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--radius-sm);background:transparent;border:1px solid transparent;color:var(--muted2);font-size:12px;font-weight:600;font-family:'Inter','Plus Jakarta Sans',sans-serif;text-decoration:none;cursor:pointer;transition:all var(--transition-fast);white-space:nowrap}
        .nav-btn:hover{color:var(--accent);background:var(--accent-dim);border-color:var(--accent-border)}
        .badge{font-size:9.5px;font-weight:700;padding:2.5px 7px;border-radius:999px;border:1.5px solid;background:transparent;font-family:'Inter','Plus Jakarta Sans',sans-serif}
        .badge-rose{color:#e11d48;border-color:rgba(225,29,72,0.35);background:rgba(225,29,72,0.06)}.badge-amber{color:var(--amber);border-color:rgba(194,120,3,0.35);background:rgba(194,120,3,0.06)}
        .dropdown{position:relative}.dropdown-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:180px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:6px;z-index:9999;opacity:0;visibility:hidden;transform:translateY(-8px) scale(0.97);transition:all var(--transition);box-shadow:var(--shadow-xl)}.dropdown:hover .dropdown-menu{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
        .dd-item{display:block;padding:8px 13px;font-size:12px;font-weight:600;color:var(--muted2);border-radius:var(--radius-sm);text-decoration:none;transition:all var(--transition-fast)}.dd-item:hover{background:var(--accent-dim);color:var(--accent)}
        .icon-btn{width:34px;height:34px;border-radius:var(--radius-sm);background:transparent;border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition-fast);font-size:12px}.icon-btn:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
        .content{flex:1;overflow-y:auto;padding:24px;background:var(--surface);display:flex;flex-direction:column;gap:20px}
        .glass-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm)}
        .sec-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}
        .btn-primary{background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:var(--radius);padding:10px 20px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all var(--transition-fast);display:inline-flex;align-items:center;gap:6px}
        .btn-primary:hover{background:var(--accent-dim);border-color:var(--accent-hover);color:var(--accent-hover);transform:translateY(-1px)}
        .btn-ghost{background:transparent;color:var(--muted2);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;transition:all var(--transition-fast)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
        .form-group{margin-bottom:14px}.form-label{display:block;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
        .form-input,.form-select{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:13px;font-weight:500;font-family:'Inter','Plus Jakarta Sans',sans-serif;outline:none;transition:border-color var(--transition-fast)}.form-input:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(240,90,20,0.08)}
        .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(11,16,24,0.4);z-index:9000;backdrop-filter:blur(8px);align-items:center;justify-content:center}.modal-backdrop.open{display:flex}
        .modal-box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:28px;width:90%;max-width:600px;box-shadow:var(--shadow-xl);animation:modalIn 0.3s ease}@keyframes modalIn{from{opacity:0;transform:scale(0.94) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:12px 16px;font-size:12.5px;font-weight:600;z-index:99999;display:flex;align-items:center;gap:10px;max-width:320px;animation:toastIn 0.35s ease forwards;box-shadow:var(--shadow-xl)}@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}.toast.hide{animation:toastOut 0.3s ease forwards}@keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
        .channel-check{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition-fast)}.channel-check:hover{border-color:var(--border2);background:var(--surface2)}.channel-check.active{border-color:var(--accent);background:var(--accent-dim)}
        .recipient-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:20px;font-size:11px;font-weight:600;color:var(--accent)}
    </style>
</head>
<body>
<div id="mobileOverlay" class="overlay md:hidden"></div>

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar">
    <div style="height:58px;display:flex;align-items:center;padding:0 18px;gap:13px;border-bottom:1px solid var(--border);flex-shrink:0;">
        <div style="width:30px;height:30px;border-radius:var(--radius-sm);background:var(--accent-dim);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i class="fas fa-bolt" style="color:var(--accent);font-size:12px;"></i>
        </div>
        <span class="logo-text">Faster<span style="color:var(--accent);">Hub</span></span>
    </div>
    <nav style="flex:1;padding:14px 9px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;" class="hide-scrollbar">
        <a href="dashboard.html" class="nav-link"><i class="fas fa-chart-pie nav-icon"></i><span class="nav-text">Dashboard</span></a>
        <a href="order-management.html" class="nav-link"><i class="fas fa-bolt nav-icon"></i><span class="nav-text">Active Orders</span></a>
        <a href="pending-orders.html" class="nav-link"><i class="fas fa-clock nav-icon"></i><span class="nav-text">Pending Orders</span></a>
        <a href="reports.html" class="nav-link"><i class="fas fa-chart-bar nav-icon"></i><span class="nav-text">Reports</span></a>
        <a href="financials.html" class="nav-link"><i class="fas fa-chart-line nav-icon"></i><span class="nav-text">Financials</span></a>
        <a href="shops.html" class="nav-link"><i class="fas fa-store nav-icon"></i><span class="nav-text">Shops</span></a>
        <a href="admin-topups.html" class="nav-link"><i class="fas fa-wallet nav-icon"></i><span class="nav-text">Top-up</span></a>
        <a href="withdraw-requests.html" class="nav-link"><i class="fas fa-money-bill-transfer nav-icon"></i><span class="nav-text">Payouts</span></a>
        <a href="promotions.html" class="nav-link"><i class="fas fa-ad nav-icon"></i><span class="nav-text">Promotions</span></a>
        <a href="announcement.html" class="nav-link active"><i class="fas fa-bullhorn nav-icon"></i><span class="nav-text">Announce</span></a>
        <div style="margin-top:auto;"></div>
        <a href="settings.html" class="nav-link"><i class="fas fa-cogs nav-icon"></i><span class="nav-text">Settings</span></a>
    </nav>
</aside>

<!-- MAIN -->
<main class="main">
    <!-- HEADER -->
    <header class="header">
        <button id="openMobileMenu" class="icon-btn md:hidden" style="flex-shrink:0;"><i class="fas fa-bars text-xs"></i></button>
        <nav style="display:flex;align-items:center;gap:8px;flex:1;">
            <div class="dropdown">
                <button class="nav-btn"><i class="fas fa-plus" style="font-size:9px;"></i> Add <i class="fas fa-chevron-down" style="font-size:7px;opacity:0.4;margin-left:3px;"></i></button>
                <div class="dropdown-menu">
                    <a href="add-order.html" class="dd-item"><i class="fas fa-receipt" style="margin-right:8px;opacity:0.5;"></i>Add New Order</a>
                    <a href="add-rider.html" class="dd-item"><i class="fas fa-motorcycle" style="margin-right:8px;opacity:0.5;"></i>Add New Rider</a>
                    <a href="announcement.html" class="dd-item"><i class="fas fa-bullhorn" style="margin-right:8px;opacity:0.5;"></i>Announcement</a>
                </div>
            </div>
            <a href="admin-topups.html" class="nav-btn">Top-up <span id="badgeTopup" class="badge badge-rose">0</span></a>
            <a href="withdraw-requests.html" class="nav-btn">Payout <span id="badgePayout" class="badge badge-amber">0</span></a>
            <div class="dropdown">
                <button class="nav-btn" style="color:var(--blue);border-color:rgba(26,86,219,0.18);background:rgba(26,86,219,0.05);"><i class="fas fa-download" style="font-size:9px;"></i> Download <i class="fas fa-chevron-down" style="font-size:7px;opacity:0.4;"></i></button>
                <div class="dropdown-menu" style="min-width:220px;">
                    <a class="dd-item" onclick="alert('Orders PDF')"><i class="fas fa-file-pdf" style="margin-right:8px;color:var(--red);"></i>Orders PDF</a>
                    <a class="dd-item" onclick="alert('Customer PDF')"><i class="fas fa-users" style="margin-right:8px;color:var(--blue);"></i>Customer Data PDF</a>
                </div>
            </div>
        </nav>
        <div style="display:flex;align-items:center;gap:10px;">
            <button class="icon-btn" onclick="refreshData()"><i class="fas fa-rotate-right"></i></button>
        </div>
    </header>

    <!-- CONTENT -->
    <div class="content">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
            <div>
                <p class="sec-label">Communication Hub</p>
                <h1 style="font-family:'Inter','Playfair Display',serif;font-size:24px;font-weight:900;color:var(--text);">Announcements</h1>
            </div>
            <button class="btn-primary" onclick="openCreateModal()"><i class="fas fa-plus"></i> New Announcement</button>
        </div>
        <div id="announcementsList" style="display:flex;flex-direction:column;gap:12px;">Loading...</div>
    </div>
</main>

<!-- MODAL for creating/editing -->
<div class="modal-backdrop" id="announceModal">
    <div class="modal-box">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <h3 style="font-weight:800;font-size:18px;" id="modalTitle">New Announcement</h3>
            <button class="icon-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
        </div>
        <input type="hidden" id="editId">
        <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" id="annTitle" class="form-input" placeholder="e.g., Holiday Schedule Update">
        </div>
        <div class="form-group">
            <label class="form-label">Message</label>
            <textarea id="annMessage" class="form-input" rows="4" placeholder="Write your announcement..."></textarea>
        </div>

        <!-- TARGET SELECTION -->
        <div class="form-group">
            <label class="form-label">Target Audience</label>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
                <label class="channel-check" id="targetAllCustomers" onclick="toggleTarget(this,'allCustomers')">
                    <i class="fas fa-users"></i> All Customers
                </label>
                <label class="channel-check" id="targetAllRiders" onclick="toggleTarget(this,'allRiders')">
                    <i class="fas fa-motorcycle"></i> All Riders
                </label>
                <label class="channel-check" id="targetSpecific" onclick="toggleTarget(this,'specific')">
                    <i class="fas fa-phone"></i> Specific Phones
                </label>
            </div>
            <div id="specificPhonesContainer" style="display:none;margin-top:8px;">
                <input type="text" id="specificPhones" class="form-input" placeholder="Enter phone numbers separated by commas">
            </div>
            <div id="selectedTargets" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;"></div>
        </div>

        <!-- DELIVERY CHANNELS -->
        <div class="form-group">
            <label class="form-label">Delivery Channels</label>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
                <label class="channel-check" id="chInApp" onclick="toggleChannel(this,'inApp')">
                    <i class="fas fa-bell"></i> In-App Notification
                </label>
                <label class="channel-check" id="chWhatsApp" onclick="toggleChannel(this,'whatsapp')">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </label>
                <label class="channel-check" id="chEmail" onclick="toggleChannel(this,'email')">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <label class="channel-check" id="chSMS" onclick="toggleChannel(this,'sms')">
                    <i class="fas fa-sms"></i> SMS
                </label>
            </div>
            <div id="selectedChannels" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;"></div>
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button class="btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" id="saveAnnounceBtn" onclick="saveAnnouncement()">Save & Send</button>
        </div>
    </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-backdrop" id="detailModal">
    <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="font-weight:800;font-size:18px;">Announcement Details</h3>
            <button class="icon-btn" onclick="document.getElementById('detailModal').classList.remove('open')"><i class="fas fa-times"></i></button>
        </div>
        <div id="detailContent"></div>
    </div>
</div>

<script>
    const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let selectedTargets = new Set();
    let selectedChannels = new Set();

    function showToast(msg, type='info') {
        const icons = {success:'✅', error:'❌', info:'ℹ️', warning:'⚠️'};
        const t = document.createElement('div'); t.className = 'toast';
        t.innerHTML = `<span>${icons[type]||'•'}</span><span>${msg}</span>`;
        document.body.appendChild(t);
        setTimeout(()=>{ t.classList.add('hide'); setTimeout(()=>t.remove(),300); }, 3000);
    }

    function toggleTarget(el, type) {
        if (selectedTargets.has(type)) {
            selectedTargets.delete(type);
            el.classList.remove('active');
        } else {
            selectedTargets.add(type);
            el.classList.add('active');
        }
        document.getElementById('specificPhonesContainer').style.display = selectedTargets.has('specific') ? 'block' : 'none';
        updateSelectedTags();
    }

    function toggleChannel(el, type) {
        if (selectedChannels.has(type)) {
            selectedChannels.delete(type);
            el.classList.remove('active');
        } else {
            selectedChannels.add(type);
            el.classList.add('active');
        }
        updateChannelTags();
    }

    function updateSelectedTags() {
        const container = document.getElementById('selectedTargets');
        container.innerHTML = '';
        selectedTargets.forEach(t => {
            const tag = document.createElement('span'); tag.className = 'recipient-tag';
            tag.innerHTML = `${t === 'allCustomers' ? 'All Customers' : t === 'allRiders' ? 'All Riders' : 'Specific Phones'} <i class="fas fa-times" style="cursor:pointer;margin-left:4px;" onclick="removeTarget('${t}')"></i>`;
            container.appendChild(tag);
        });
    }

    function updateChannelTags() {
        const container = document.getElementById('selectedChannels');
        container.innerHTML = '';
        selectedChannels.forEach(c => {
            const tag = document.createElement('span'); tag.className = 'recipient-tag';
            tag.innerHTML = `${c} <i class="fas fa-times" style="cursor:pointer;margin-left:4px;" onclick="removeChannel('${c}')"></i>`;
            container.appendChild(tag);
        });
    }

    function removeTarget(type) {
        selectedTargets.delete(type);
        document.getElementById('targetAllCustomers').classList.toggle('active', selectedTargets.has('allCustomers'));
        document.getElementById('targetAllRiders').classList.toggle('active', selectedTargets.has('allRiders'));
        document.getElementById('targetSpecific').classList.toggle('active', selectedTargets.has('specific'));
        document.getElementById('specificPhonesContainer').style.display = selectedTargets.has('specific') ? 'block' : 'none';
        updateSelectedTags();
    }

    function removeChannel(type) {
        selectedChannels.delete(type);
        document.getElementById('chInApp').classList.toggle('active', selectedChannels.has('inApp'));
        document.getElementById('chWhatsApp').classList.toggle('active', selectedChannels.has('whatsapp'));
        document.getElementById('chEmail').classList.toggle('active', selectedChannels.has('email'));
        document.getElementById('chSMS').classList.toggle('active', selectedChannels.has('sms'));
        updateChannelTags();
    }

    async function fetchBadges() {
        const { count: topup } = await _supabase.from('topup_requests').select('id', {count:'exact', head:true}).eq('status','pending');
        const { count: payout } = await _supabase.from('withdraw_requests').select('id', {count:'exact', head:true}).eq('status','pending');
        document.getElementById('badgeTopup').textContent = topup || 0;
        document.getElementById('badgePayout').textContent = payout || 0;
    }

    // ─── LOAD ANNOUNCEMENTS (using notifications table only) ───
    async function loadAnnouncements() {
        const list = document.getElementById('announcementsList');
        // Get all announcement master records (phone = 'master')
        const { data: masters, error } = await _supabase
            .from('notifications')
            .select('*')
            .eq('phone', 'master')
            .order('created_at', { ascending: false });

        if (error) {
            list.innerHTML = `<div style="color:var(--red);padding:20px;">Failed to load announcements: ${error.message}</div>`;
            return;
        }
        if (!masters || masters.length === 0) {
            list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);">No announcements yet. Create your first one!</div>';
            return;
        }

        list.innerHTML = masters.map(m => {
            // customer_phone field holds the group UUID
            const groupId = m.customer_phone;
            const meta = JSON.parse(m.message); // message stores JSON with original message, targets, channels
            return `
                <div class="glass-card" style="display:flex;justify-content:space-between;align-items:center;">
                    <div style="flex:1;">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                            <h4 style="font-weight:700;">${escapeHtml(m.title)}</h4>
                            <span class="badge badge-sky">${meta.target_summary || 'Unknown'}</span>
                        </div>
                        <p style="font-size:13px;color:var(--muted2);">${escapeHtml(meta.message || '')}</p>
                        <div style="font-size:10px;color:var(--muted);margin-top:4px;">${new Date(m.created_at).toLocaleString()}</div>
                    </div>
                    <div style="display:flex;gap:6px;">
                        <button class="icon-btn" onclick="viewDetail('${groupId}')"><i class="fas fa-eye"></i></button>
                        <button class="icon-btn" onclick="deleteAnnouncement('${groupId}')"><i class="fas fa-trash" style="color:var(--red);"></i></button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(text) { return String(text).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

    async function openCreateModal() {
        document.getElementById('editId').value = '';
        document.getElementById('annTitle').value = '';
        document.getElementById('annMessage').value = '';
        document.getElementById('specificPhones').value = '';
        selectedTargets.clear(); selectedChannels.clear();
        document.querySelectorAll('.channel-check').forEach(el => el.classList.remove('active'));
        document.getElementById('specificPhonesContainer').style.display = 'none';
        updateSelectedTags(); updateChannelTags();
        document.getElementById('modalTitle').textContent = 'New Announcement';
        document.getElementById('announceModal').classList.add('open');
    }

    function closeModal() { document.getElementById('announceModal').classList.remove('open'); }

    async function saveAnnouncement() {
        const title = document.getElementById('annTitle').value.trim();
        const messageText = document.getElementById('annMessage').value.trim();
        if (!title || !messageText) return showToast('Title and message required', 'warning');
        if (selectedTargets.size === 0) return showToast('Select at least one target audience', 'warning');
        if (selectedChannels.size === 0) return showToast('Select at least one delivery channel', 'warning');

        const specificPhones = selectedTargets.has('specific') ? document.getElementById('specificPhones').value.split(',').map(p=>p.trim()).filter(p=>p) : [];
        if (selectedTargets.has('specific') && specificPhones.length === 0) return showToast('Enter specific phone numbers', 'warning');

        const targetSummary = [...selectedTargets].join(', ');
        const channels = [...selectedChannels];
        const groupId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString();

        // 1. Save master record in notifications
        const masterPayload = {
            phone: 'master',
            customer_phone: groupId, // used as group identifier
            title: title,
            message: JSON.stringify({
                message: messageText,
                target_summary: targetSummary,
                channels: channels,
                specific_phones: specificPhones
            }),
            is_read: true,
            created_at: new Date().toISOString()
        };

        const { error: masterError } = await _supabase.from('notifications').insert(masterPayload);
        if (masterError) {
            showToast('Failed to save announcement', 'error');
            console.error(masterError);
            return;
        }

        // 2. Prepare recipient list
        let phoneNumbers = [];
        if (selectedTargets.has('allCustomers')) {
            const { data: customers } = await _supabase.from('customers').select('phone');
            if (customers) phoneNumbers.push(...customers.map(c=>c.phone));
        }
        if (selectedTargets.has('allRiders')) {
            const { data: riders } = await _supabase.from('riders').select('phone');
            if (riders) phoneNumbers.push(...riders.map(r=>r.phone));
        }
        if (selectedTargets.has('specific')) phoneNumbers.push(...specificPhones);
        const uniquePhones = [...new Set(phoneNumbers)];

        // 3. Insert individual notifications if in-app channel selected
        if (channels.includes('inApp') && uniquePhones.length > 0) {
            const notifications = uniquePhones.map(phone => ({
                phone: phone,
                customer_phone: groupId,  // link to the group
                title: title,
                message: messageText,
                is_read: false,
                created_at: new Date().toISOString()
            }));
            const { error: notifError } = await _supabase.from('notifications').insert(notifications);
            if (notifError) showToast('In-app notifications partially failed', 'warning');
        }

        // 4. Generate external channel links
        let actionLinks = [];
        if (channels.includes('whatsapp')) actionLinks.push(`WhatsApp: https://wa.me/?text=${encodeURIComponent(messageText)}`);
        if (channels.includes('sms')) actionLinks.push(`SMS: sms:?body=${encodeURIComponent(messageText)}`);
        if (channels.includes('email')) actionLinks.push(`Email: mailto:?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(messageText)}`);

        showToast('Announcement sent!', 'success');
        closeModal();
        loadAnnouncements();

        if (actionLinks.length) {
            setTimeout(() => alert('External channel links:\n' + actionLinks.join('\n')), 500);
        }
    }

    async function viewDetail(groupId) {
        // Fetch master record for this group
        const { data: master } = await _supabase
            .from('notifications')
            .select('*')
            .eq('customer_phone', groupId)
            .eq('phone', 'master')
            .single();

        if (!master) return;
        const meta = JSON.parse(master.message);
        // Count recipients
        const { count } = await _supabase
            .from('notifications')
            .select('*', { count: 'exact', head: true })
            .eq('customer_phone', groupId)
            .neq('phone', 'master');

        const content = `
            <p><strong>Title:</strong> ${escapeHtml(master.title)}</p>
            <p><strong>Message:</strong> ${escapeHtml(meta.message)}</p>
            <p><strong>Target:</strong> ${meta.target_summary}</p>
            <p><strong>Channels:</strong> ${meta.channels.join(', ')}</p>
            <p><strong>Recipients:</strong> ${count || 0} people</p>
            <p><strong>Sent at:</strong> ${new Date(master.created_at).toLocaleString()}</p>
            ${meta.specific_phones?.length ? `<p><strong>Specific Phones:</strong> ${meta.specific_phones.join(', ')}</p>` : ''}
        `;
        document.getElementById('detailContent').innerHTML = content;
        document.getElementById('detailModal').classList.add('open');
    }

    async function deleteAnnouncement(groupId) {
        if (!confirm('Delete this announcement and all associated notifications?')) return;
        const { error } = await _supabase
            .from('notifications')
            .delete()
            .eq('customer_phone', groupId);
        if (error) {
            showToast('Delete failed: ' + error.message, 'error');
        } else {
            showToast('Announcement deleted', 'success');
            loadAnnouncements();
        }
    }

    function refreshData() {
        fetchBadges();
        loadAnnouncements();
    }

    document.getElementById('openMobileMenu').addEventListener('click', ()=>{
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('mobileOverlay').classList.toggle('show');
    });
    document.getElementById('mobileOverlay').addEventListener('click', ()=>{
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('mobileOverlay').classList.remove('show');
    });
    document.getElementById('announceModal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
    document.getElementById('detailModal').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('open'); });

    // Start
    fetchBadges();
    loadAnnouncements();
</script>
</body>
</html>
