<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FasterHub — Announcements</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #f6f7fb;
            --bg2: #eef0f7;
            --surface: #ffffff;
            --surface2: #f8f9fd;
            --surface3: #f0f2f9;
            --border: rgba(15, 22, 35, 0.06);
            --border2: rgba(15, 22, 35, 0.10);
            --text: #0b1018;
            --text2: #2a3045;
            --muted: #7b8298;
            --muted2: #5a6178;
            --accent: #f05a14;
            --accent-dim: rgba(240, 90, 20, 0.07);
            --accent-border: rgba(240, 90, 20, 0.18);
            --accent-hover: #d94a0a;
            --green: #0f9d4a;
            --green-dim: rgba(15, 157, 74, 0.07);
            --blue: #1a56db;
            --blue-dim: rgba(26, 86, 219, 0.07);
            --red: #d92c2c;
            --red-dim: rgba(217, 44, 44, 0.07);
            --amber: #c27803;
            --amber-dim: rgba(194, 120, 3, 0.07);
            --purple: #6c2bd9;
            --purple-dim: rgba(108, 43, 217, 0.07);
            --sky: #0374a8;
            --sky-dim: rgba(3, 116, 168, 0.07);
            --shadow-sm: 0 1px 2px rgba(11, 16, 24, 0.04);
            --shadow-md: 0 4px 16px rgba(11, 16, 24, 0.06);
            --shadow-lg: 0 8px 32px rgba(11, 16, 24, 0.09);
            --shadow-xl: 0 16px 48px rgba(11, 16, 24, 0.12);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.01em;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 68px;
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 50;
            flex-shrink: 0;
            transition: width var(--transition-slow);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        @media (min-width: 768px) {
            .sidebar:hover {
                width: 228px;
            }
            .sidebar:hover .nav-text {
                opacity: 1;
                transform: translateX(0);
                pointer-events: auto;
            }
            .sidebar:hover .logo-text {
                opacity: 1;
                max-width: 120px;
            }
        }
        @media (max-width: 767px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-100%);
                transition: transform var(--transition-slow);
                width: 228px;
                border-radius: 0 var(--radius-xl) var(--radius-xl) 0;
                box-shadow: var(--shadow-xl);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .nav-text {
                opacity: 1;
                transform: translateX(0);
                pointer-events: auto;
            }
            .logo-text {
                opacity: 1;
                max-width: 120px;
            }
        }

        .logo-text {
            opacity: 0;
            max-width: 0;
            transition: opacity var(--transition), max-width var(--transition-slow);
            white-space: nowrap;
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 15px;
            color: var(--text);
            overflow: hidden;
        }

        .nav-text {
            opacity: 0;
            transform: translateX(-8px);
            pointer-events: none;
            transition: opacity var(--transition), transform var(--transition);
            white-space: nowrap;
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 10px 18px;
            border-radius: var(--radius);
            color: var(--muted);
            text-decoration: none;
            transition: all var(--transition-fast);
            position: relative;
            margin: 1.5px 0;
            font-weight: 500;
            letter-spacing: -0.01em;
        }
        .nav-link:hover {
            color: var(--text2);
            background: var(--surface2);
        }
        .nav-link.active {
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(240, 90, 20, 0.08);
        }
        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 18%;
            bottom: 18%;
            width: 3px;
            background: var(--accent);
            border-radius: 999px;
        }
        .nav-icon {
            width: 30px;
            text-align: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(11, 16, 24, 0.35);
            z-index: 40;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .overlay.show {
            display: block;
        }

        /* ── MAIN ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
            z-index: 1;
            min-width: 0;
        }

        /* ── HEADER ── */
        .header {
            height: 58px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 22px;
            gap: 12px;
            flex-shrink: 0;
            position: relative;
            z-index: 200;
            overflow: visible;
            box-shadow: var(--shadow-sm);
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 13px;
            border-radius: var(--radius-sm);
            background: transparent;
            border: 1px solid transparent;
            color: var(--muted2);
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.01em;
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        .nav-btn:hover {
            color: var(--accent);
            background: var(--accent-dim);
            border-color: var(--accent-border);
        }
        .nav-btn.active-nav {
            color: var(--accent);
            background: var(--accent-dim);
            border-color: var(--accent-border);
            font-weight: 700;
        }

        .badge {
            font-size: 9.5px;
            font-weight: 700;
            padding: 2.5px 7px;
            border-radius: 999px;
            border: 1.5px solid;
            background: transparent;
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.01em;
            line-height: 1;
        }
        .badge-rose {
            color: #e11d48;
            border-color: rgba(225, 29, 72, 0.35);
            background: rgba(225, 29, 72, 0.06);
        }
        .badge-amber {
            color: var(--amber);
            border-color: rgba(194, 120, 3, 0.35);
            background: rgba(194, 120, 3, 0.06);
        }
        .badge-sky {
            color: var(--sky);
            border-color: rgba(3, 116, 168, 0.35);
            background: rgba(3, 116, 168, 0.06);
        }
        .badge-green {
            color: var(--green);
            border-color: rgba(15, 157, 74, 0.35);
            background: rgba(15, 157, 74, 0.06);
        }
        .badge-red {
            color: var(--red);
            border-color: rgba(217, 44, 44, 0.35);
            background: rgba(217, 44, 44, 0.06);
        }
        .badge-purple {
            color: var(--purple);
            border-color: rgba(108, 43, 217, 0.35);
            background: rgba(108, 43, 217, 0.06);
        }
        .badge-orange {
            color: var(--accent);
            border-color: rgba(240, 90, 20, 0.35);
            background: rgba(240, 90, 20, 0.06);
        }

        .dropdown {
            position: relative;
        }
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 180px;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--radius-lg);
            padding: 6px;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.97);
            transition: all var(--transition);
            box-shadow: var(--shadow-xl);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .dd-item {
            display: block;
            padding: 8px 13px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            color: var(--muted2);
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: all var(--transition-fast);
            letter-spacing: -0.01em;
        }
        .dd-item:hover {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 12px;
        }
        .icon-btn:hover {
            border-color: var(--border2);
            color: var(--text);
            background: var(--surface2);
            box-shadow: var(--shadow-sm);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--surface);
        }

        .glass-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: var(--shadow-sm);
        }

        .sec-label {
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .btn-primary {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            border-radius: var(--radius);
            padding: 10px 20px;
            font-size: 12.5px;
            font-weight: 700;
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all var(--transition-fast);
            letter-spacing: -0.01em;
            box-shadow: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary:hover {
            background: var(--accent-dim);
            border-color: var(--accent-hover);
            color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(240, 90, 20, 0.15);
        }

        .btn-ghost {
            background: transparent;
            color: var(--muted2);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .btn-ghost:hover {
            background: var(--surface2);
            color: var(--text);
            border-color: var(--muted);
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .form-select,
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            outline: none;
            transition: border-color var(--transition-fast);
        }
        .form-select:focus,
        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(240, 90, 20, 0.08);
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(11, 16, 24, 0.4);
            z-index: 9000;
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }
        .modal-backdrop.open {
            display: flex;
        }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--radius-xl);
            padding: 28px;
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow-xl);
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.94) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            font-size: 12.5px;
            font-weight: 600;
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 320px;
            animation: toastIn 0.35s ease forwards;
            box-shadow: var(--shadow-xl);
            color: var(--text);
        }
        @keyframes toastIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast.hide {
            animation: toastOut 0.3s ease forwards;
        }
        @keyframes toastOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }

        .announcement-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: all var(--transition);
        }
        .announcement-card:hover {
            border-color: var(--border2);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
<div id="mobileOverlay" class="overlay md:hidden"></div>

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar">
    <div style="height:58px;display:flex;align-items:center;padding:0 18px;gap:13px;border-bottom:1px solid var(--border);flex-shrink:0;">
        <div style="width:30px;height:30px;border-radius:var(--radius-sm);background:var(--accent-dim);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i class="fas fa-bolt" style="color:var(--accent);font-size:12px;"></i>
        </div>
        <span class="logo-text">Faster<span style="color:var(--accent);">Hub</span></span>
    </div>
    <nav style="flex:1;padding:14px 9px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;" class="hide-scrollbar">
        <a href="dashboard.html" class="nav-link">
            <i class="fas fa-chart-pie nav-icon"></i> <span class="nav-text">Dashboard</span>
        </a>
        <a href="order-management.html" class="nav-link">
            <i class="fas fa-bolt nav-icon"></i> <span class="nav-text">Active Orders</span>
        </a>
        <a href="pending-orders.html" class="nav-link">
            <i class="fas fa-clock nav-icon"></i> <span class="nav-text">Pending Orders</span>
        </a>
        <a href="reports.html" class="nav-link">
            <i class="fas fa-chart-bar nav-icon"></i> <span class="nav-text">Reports</span>
        </a>
        <a href="financials.html" class="nav-link">
            <i class="fas fa-chart-line nav-icon"></i> <span class="nav-text">Financials</span>
        </a>
        <a href="shops.html" class="nav-link">
            <i class="fas fa-store nav-icon"></i> <span class="nav-text">Shops</span>
        </a>
        <a href="admin-topups.html" class="nav-link">
            <i class="fas fa-wallet nav-icon"></i> <span class="nav-text">Top-up</span>
        </a>
        <a href="withdraw-requests.html" class="nav-link">
            <i class="fas fa-money-bill-transfer nav-icon"></i> <span class="nav-text">Payouts</span>
        </a>
        <a href="promotions.html" class="nav-link">
            <i class="fas fa-ad nav-icon"></i> <span class="nav-text">Promotions</span>
        </a>
        <a href="announcement.html" class="nav-link active">
            <i class="fas fa-bullhorn nav-icon"></i> <span class="nav-text">Announce</span>
        </a>
        <div style="margin-top:auto;"></div>
        <a href="settings.html" class="nav-link">
            <i class="fas fa-cogs nav-icon"></i> <span class="nav-text">Settings</span>
        </a>
    </nav>
</aside>

<!-- MAIN -->
<main class="main">
    <!-- HEADER (exactly same as dashboard) -->
    <header class="header">
        <button id="openMobileMenu" class="icon-btn md:hidden" style="flex-shrink:0;">
            <i class="fas fa-bars text-xs"></i>
        </button>
        <nav style="display:flex;align-items:center;gap:8px;flex:1;" class="hide-scrollbar">
            <div class="dropdown">
                <button class="nav-btn"><i class="fas fa-plus" style="font-size:9px;"></i> Add <i class="fas fa-chevron-down" style="font-size:7px;opacity:0.4;margin-left:3px;"></i></button>
                <div class="dropdown-menu">
                    <a href="add-order.html" class="dd-item"><i class="fas fa-receipt" style="margin-right:8px;opacity:0.5;"></i>Add New Order</a>
                    <a href="add-rider.html" class="dd-item"><i class="fas fa-motorcycle" style="margin-right:8px;opacity:0.5;"></i>Add New Rider</a>
                    <a href="announcement.html" class="dd-item"><i class="fas fa-bullhorn" style="margin-right:8px;opacity:0.5;"></i>Announcement</a>
                </div>
            </div>
            <a href="admin-topups.html" class="nav-btn">Top-up <span id="badgeTopup" class="badge badge-rose">0</span></a>
            <a href="withdraw-requests.html" class="nav-btn">Payout <span id="badgePayout" class="badge badge-amber">0</span></a>
            <div class="dropdown">
                <button class="nav-btn" style="color:var(--blue);border-color:rgba(26,86,219,0.18);background:rgba(26,86,219,0.05);">
                    <i class="fas fa-download" style="font-size:9px;"></i> Download <i class="fas fa-chevron-down" style="font-size:7px;opacity:0.4;margin-left:3px;"></i>
                </button>
                <div class="dropdown-menu" style="min-width:220px;">
                    <a class="dd-item" onclick="alert('Orders PDF')"><i class="fas fa-file-pdf" style="margin-right:8px;color:var(--red);"></i>Orders PDF</a>
                    <a class="dd-item" onclick="alert('Customer PDF')"><i class="fas fa-users" style="margin-right:8px;color:var(--blue);"></i>Customer Data PDF</a>
                </div>
            </div>
        </nav>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
            <div id="lastSync" style="font-size:9.5px;color:var(--muted);font-weight:500;"></div>
            <button class="icon-btn" onclick="fetchAnnouncements()" title="Refresh"><i class="fas fa-rotate-right" style="font-size:11px;"></i></button>
        </div>
    </header>

    <!-- CONTENT -->
    <div class="content">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
            <div>
                <p class="sec-label" style="margin-bottom:4px;">Communication</p>
                <h1 style="font-family:'Inter','Playfair Display',serif;font-size:24px;font-weight:900;color:var(--text);">Announcements</h1>
            </div>
            <button class="btn-primary" onclick="openCreateModal()"><i class="fas fa-plus"></i> New Announcement</button>
        </div>

        <div id="announcementsList" style="display:flex;flex-direction:column;gap:12px;">
            <div style="text-align:center;padding:40px;color:var(--muted);">Loading announcements...</div>
        </div>
    </div>
</main>

<!-- CREATE/EDIT MODAL -->
<div class="modal-backdrop" id="announceModal">
    <div class="modal-box">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <h3 class="modal-title" id="modalTitle">New Announcement</h3>
            <button class="icon-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
        </div>
        <input type="hidden" id="editId">
        <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" id="annTitle" class="form-input" placeholder="e.g. Holiday schedule">
        </div>
        <div class="form-group">
            <label class="form-label">Message</label>
            <textarea id="annMessage" class="form-input" rows="3" placeholder="Details..."></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Target Audience</label>
            <select id="annTarget" class="form-select">
                <option value="all">All Users</option>
                <option value="shops">Shops Only</option>
                <option value="riders">Riders Only</option>
            </select>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button class="btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" id="saveAnnounceBtn" onclick="saveAnnouncement()">Save</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // Toast
    function showToast(msg, type='info') {
        const icons = {success:'✅', error:'❌', info:'ℹ️'};
        const t = document.createElement('div');
        t.className = 'toast';
        t.innerHTML = `<span>${icons[type]||'•'}</span><span>${msg}</span>`;
        document.body.appendChild(t);
        setTimeout(()=>{ t.classList.add('hide'); setTimeout(()=>t.remove(),300); }, 3000);
    }

    // Fetch header badges (topup/payout)
    async function fetchBadges() {
        const { count: topup } = await _supabase.from('topup_requests').select('id', {count:'exact', head:true}).eq('status','pending');
        const { count: payout } = await _supabase.from('withdraw_requests').select('id', {count:'exact', head:true}).eq('status','pending');
        document.getElementById('badgeTopup').textContent = topup || 0;
        document.getElementById('badgePayout').textContent = payout || 0;
    }

    // Fetch announcements
    async function fetchAnnouncements() {
        const listEl = document.getElementById('announcementsList');
        listEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);">Loading...</div>';
        const { data, error } = await _supabase.from('announcements').select('*').order('created_at', {ascending: false});
        if (error) {
            listEl.innerHTML = `<div style="color:var(--red);text-align:center;">Failed to load announcements</div>`;
            showToast('Failed to load', 'error');
            return;
        }
        if (!data || data.length === 0) {
            listEl.innerHTML = `<div style="text-align:center;padding:48px;color:var(--muted);">No announcements yet. Create one!</div>`;
            return;
        }
        listEl.innerHTML = data.map(a => `
            <div class="announcement-card" style="display:flex;justify-content:space-between;align-items:center;">
                <div style="flex:1;">
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
                        <h4 style="font-weight:700;color:var(--text);">${escapeHtml(a.title)}</h4>
                        <span class="badge ${a.target==='shops'?'badge-sky':a.target==='riders'?'badge-amber':'badge-green'}">${a.target}</span>
                    </div>
                    <p style="font-size:13px;color:var(--muted2);">${escapeHtml(a.message)}</p>
                    <div style="font-size:10px;color:var(--muted);margin-top:6px;">${new Date(a.created_at).toLocaleString()}</div>
                </div>
                <div style="display:flex;gap:6px;">
                    <button class="icon-btn" onclick="editAnnouncement('${a.id}')"><i class="fas fa-pen"></i></button>
                    <button class="icon-btn" style="color:var(--red);" onclick="deleteAnnouncement('${a.id}')"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        `).join('');
    }

    function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, function(m) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
        });
    }

    // Modal
    function openCreateModal() {
        document.getElementById('editId').value = '';
        document.getElementById('annTitle').value = '';
        document.getElementById('annMessage').value = '';
        document.getElementById('annTarget').value = 'all';
        document.getElementById('modalTitle').textContent = 'New Announcement';
        document.getElementById('announceModal').classList.add('open');
    }
    function closeModal() {
        document.getElementById('announceModal').classList.remove('open');
    }
    async function editAnnouncement(id) {
        const { data, error } = await _supabase.from('announcements').select('*').eq('id', id).single();
        if (error) return showToast('Failed to load', 'error');
        document.getElementById('editId').value = data.id;
        document.getElementById('annTitle').value = data.title;
        document.getElementById('annMessage').value = data.message;
        document.getElementById('annTarget').value = data.target;
        document.getElementById('modalTitle').textContent = 'Edit Announcement';
        document.getElementById('announceModal').classList.add('open');
    }
    async function saveAnnouncement() {
        const id = document.getElementById('editId').value;
        const title = document.getElementById('annTitle').value.trim();
        const message = document.getElementById('annMessage').value.trim();
        const target = document.getElementById('annTarget').value;
        if (!title || !message) return showToast('Title and message required', 'warning');
        const btn = document.getElementById('saveAnnounceBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        try {
            if (id) {
                const { error } = await _supabase.from('announcements').update({ title, message, target }).eq('id', id);
                if (error) throw error;
                showToast('Announcement updated', 'success');
            } else {
                const { error } = await _supabase.from('announcements').insert({ title, message, target });
                if (error) throw error;
                showToast('Announcement created', 'success');
            }
            closeModal();
            fetchAnnouncements();
        } catch (err) {
            showToast('Error: '+err.message, 'error');
        }
        btn.disabled = false;
        btn.innerHTML = 'Save';
    }
    async function deleteAnnouncement(id) {
        if (!confirm('Delete this announcement?')) return;
        const { error } = await _supabase.from('announcements').delete().eq('id', id);
        if (error) return showToast('Delete failed', 'error');
        showToast('Deleted', 'success');
        fetchAnnouncements();
    }

    // Mobile sidebar
    document.getElementById('openMobileMenu').addEventListener('click', ()=>{
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('mobileOverlay').classList.toggle('show');
    });
    document.getElementById('mobileOverlay').addEventListener('click', ()=>{
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('mobileOverlay').classList.remove('show');
    });
    document.getElementById('announceModal').addEventListener('click', function(e){
        if (e.target === this) closeModal();
    });

    // Init
    fetchBadges();
    fetchAnnouncements();
</script>
</body>
</html>
